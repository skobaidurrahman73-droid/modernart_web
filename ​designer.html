<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ডিজাইনার প্যানেল - মডার্ণ আর্ট এন্ড প্রেস</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ডিজাইনার ড্যাশবোর্ড</h1>
    <p>এডমিন হেল্পলাইন: <a href="tel:01712371058">01712371058</a></p>
  </header>

  <main>
    <div id="login-box">
      <h3>ডিজাইনার তথ্য দিন</h3>
      <input type="text" id="designer-name" placeholder="আপনার নাম">
      <input type="tel" id="designer-phone" placeholder="আপনার ফোন নম্বর">
      <button onclick="loadOrders()">অর্ডার তালিকা দেখুন</button>
    </div>

    <div id="orders-list"></div>

    <div id="chat-box" style="display:none;">
      <h4 id="active-customer"></h4>
      <div id="messages"></div>
      <div class="input-area">
        <input type="file" id="file-input">
        <input type="text" id="msg-input" placeholder="মেসেজ লিখুন...">
        <button onclick="sendMessage()">পাঠান</button>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
