<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন প্যানেল - মডার্ণ আর্ট এন্ড প্রেস</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>এডমিন কন্ট্রোল প্যানেল</h1>
    <p>জরুরি যোগাযোগ: <a href="tel:01712371058">01712371058</a></p>
  </header>

  <main>
    <div id="login-box">
      <h3>এডমিন ড্যাশবোর্ডে প্রবেশ করুন</h3>
      <button onclick="adminLogin()">প্রবেশ করুন</button>
    </div>

    <div id="admin-dashboard" style="display:none;">
      <h3>নতুন অর্ডার তৈরি করুন</h3>
      <input type="text" id="new-receipt" placeholder="রিসিট নম্বর">
      <input type="text" id="new-name" placeholder="কাস্টমারের নাম">
      <input type="tel" id="new-phone" placeholder="কাস্টমারের ফোন নম্বর">
      <input type="text" id="new-business" placeholder="ব্যবসার নাম">
      <input type="tel" id="new-designer-phone" placeholder="ডিজাইনারের ফোন নম্বর">
      <button onclick="createOrder()">অর্ডার যুক্ত করুন</button>

      <h3>সকল অর্ডার</h3>
      <div id="all-orders"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
